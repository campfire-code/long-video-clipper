# 篝火：打 v*-campfire.* 标签时转发布上游官方安装包（流程定义在 campfire-code/toolkit-hub）
name: release
on:
  push:
    tags: ['v*-campfire.*']
permissions:
  contents: write
jobs:
  release:
    uses: campfire-code/toolkit-hub/.github/workflows/mirror-release.yml@v1
    with:
      # 只转发布 .dmg 与 -setup.exe；排除签名、更新清单、哈希文件、.app.tar.gz、命令行版 zip/whl
      exclude: '\.(sig|json|txt|whl|zip)$|\.tar\.gz$'
